<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>monitor-01 :: access denied</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      font-family: 'Courier New', Courier, monospace;
    }

    .stage {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 24px;
      text-align: center;
    }

    .banner {
      font-size: clamp(34px, 9vw, 96px);
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #f33;
      text-shadow: 0 0 10px #f33, 0 0 28px rgba(255, 40, 40, 0.5);
    }

    .code {
      color: #f88;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .message {
      color: #6f6;
      font-size: 15px;
      max-width: 480px;
      line-height: 1.6;
    }

    .login-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 10, 0, 0.9);
      border: 1px solid #0f0;
      border-radius: 6px;
      color: #0f0;
      font-family: inherit;
      font-size: 18px;
      padding: 14px 28px;
      text-decoration: none;
      box-shadow: 0 0 18px rgba(0, 255, 0, 0.25);
      transition: box-shadow 0.2s, transform 0.2s;
    }

    .login-btn:hover {
      box-shadow: 0 0 32px rgba(0, 255, 0, 0.55);
      transform: translateY(-2px);
    }

    .login-btn .prompt {
      color: #6f6;
    }

    .login-btn .cursor {
      display: inline-block;
      width: 0.5em;
      height: 1.05em;
      background: #0f0;
      vertical-align: -0.16em;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="banner">ACCESS DENIED</div>
    <div class="code">401 // unauthorized</div>
    <div class="message">You need an active session to reach this node. Authenticate at the terminal and try again.</div>
    <a class="login-btn" href="/terminal">
      <span class="prompt">$</span> login<span class="cursor"></span>
    </a>
  </div>
</body>
</html>
