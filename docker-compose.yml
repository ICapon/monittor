services:
  postgres:
    image: postgres:16-alpine
    container_name: monitor01-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-monitor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_dev_only}
      POSTGRES_DB: ${DB_NAME:-monitor01}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - monitor01-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-monitor} -d ${DB_NAME:-monitor01}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  monitor01-pgdata:
    name: monitor01-pgdata
