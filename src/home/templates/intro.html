<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>monitor-01</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      font-family: 'Courier New', Courier, monospace;
    }

    .stage {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 24px;
    }

    .banner {
      text-align: center;
      font-size: clamp(40px, 10vw, 120px);
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #0f0;
      text-shadow: 0 0 10px #0f0, 0 0 28px rgba(0, 255, 0, 0.45);
    }

    .banner .accent {
      color: #6f6;
    }

    .tagline {
      color: #6f6;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .join-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 10, 0, 0.9);
      border: 1px solid #0f0;
      border-radius: 6px;
      color: #0f0;
      font-family: inherit;
      font-size: 18px;
      padding: 14px 28px;
      text-decoration: none;
      box-shadow: 0 0 18px rgba(0, 255, 0, 0.25);
      transition: box-shadow 0.2s, transform 0.2s;
    }

    .join-btn:hover {
      box-shadow: 0 0 32px rgba(0, 255, 0, 0.55);
      transform: translateY(-2px);
    }

    .join-btn .prompt {
      color: #6f6;
    }

    .join-btn .cursor {
      display: inline-block;
      width: 0.5em;
      height: 1.05em;
      background: #0f0;
      vertical-align: -0.16em;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="banner">Welcome<span class="accent">...</span></div>
    <div class="tagline">Wanna Join?</div>
    <a class="join-btn" href="/terminal">
      <span class="prompt">$</span> Join<span class="cursor"></span>
    </a>
  </div>
</body>
</html>
