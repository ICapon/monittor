<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>monitor-01 :: terminal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      font-family: 'Courier New', Courier, monospace;
    }

    .term-body {
      position: fixed;
      inset: 0;
      padding: 20px 24px;
      color: #0f0;
      font-size: 16px;
      line-height: 1.6;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .term-line {
      text-shadow: 0 0 4px #0f0;
    }

    .prompt {
      color: #6f6;
    }

    .cursor {
      display: inline-block;
      width: 0.55em;
      height: 1em;
      background: #0f0;
      vertical-align: -0.15em;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    #hidden-input {
      position: fixed;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      border: none;
      outline: none;
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="term-body" id="term-body">
    <div class="term-line">Welcome back. Type a command and press enter.</div>
  </div>
  <input id="hidden-input" autocomplete="off" autocapitalize="off" spellcheck="false" />

  <script>
    const PROMPT_USER = 'user: ';
    const PROMPT_PASSWORD = 'password: ';
    const PROMPT_NEW_USERNAME = 'new username: ';
    const PROMPT_NEW_PASSWORD = 'new password: ';

    const termBody = document.getElementById('term-body');
    const hiddenInput = document.getElementById('hidden-input');

    let mode = 'command';
    let pendingUsername = '';
    let pendingNewUsername = '';
    // Replaced server-side (see home.controller.ts) with the username from
    // the session cookie, if any — no extra request needed to know who's
    // already logged in.
    let currentUser = /*__CURRENT_USER__*/ null;
    // Extra commands granted to the current user from the database (see
    // CommandsService) — empty for anonymous visitors. Each entry is
    // {name, response}; running one just prints its response verbatim.
    let extraCommands = /*__CURRENT_COMMANDS__*/ [];

    function getPrompt() {
      return (currentUser || 'root') + '@monitor-01:~$ ';
    }

    function focusInput() {
      hiddenInput.focus({ preventScroll: true });
    }

    function currentLine() {
      return document.querySelector('.term-line.current');
    }

    function addPromptLine(promptText, masked) {
      const line = document.createElement('div');
      line.className = 'term-line current';
      if (masked) line.dataset.masked = 'true';

      // Built with createElement/textContent (not innerHTML) because
      // promptText can contain a logged-in username — untrusted input must
      // never be parsed as markup, even though it only reaches this page
      // through an authenticated session today.
      const promptSpan = document.createElement('span');
      promptSpan.className = 'prompt';
      promptSpan.textContent = promptText;

      const typedSpan = document.createElement('span');
      typedSpan.className = 'typed-text';

      const cursorSpan = document.createElement('span');
      cursorSpan.className = 'cursor';

      line.append(promptSpan, typedSpan, cursorSpan);
      termBody.appendChild(line);
      termBody.scrollTop = termBody.scrollHeight;
    }

    function printLine(text) {
      const line = document.createElement('div');
      line.className = 'term-line';
      line.textContent = text;
      termBody.appendChild(line);
      termBody.scrollTop = termBody.scrollHeight;
    }

    function updateCurrentLine() {
      const line = currentLine();
      const masked = line.dataset.masked === 'true';
      line.querySelector('.typed-text').textContent = masked
        ? '•'.repeat(hiddenInput.value.length)
        : hiddenInput.value;
      termBody.scrollTop = termBody.scrollHeight;
    }

    function freezeCurrentLine() {
      const line = currentLine();
      line.classList.remove('current');
      line.querySelector('.cursor').remove();
    }

    function handleEnter() {
      const value = hiddenInput.value;
      freezeCurrentLine();
      hiddenInput.value = '';

      if (mode === 'auth-user') {
        pendingUsername = value;
        mode = 'auth-password';
        addPromptLine(PROMPT_PASSWORD, true);
        return;
      }

      if (mode === 'auth-password') {
        mode = 'command';
        fetch('/auth/login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: pendingUsername, password: value }),
        })
          .then((res) => {
            if (!res.ok) {
              printLine('access denied: invalid credentials.');
              return;
            }
            return res.json().then((data) => {
              currentUser = data.username;
              extraCommands = data.commands || [];
              printLine('access granted.');
            });
          })
          .catch(() => printLine('connection error: could not reach auth service.'))
          .finally(() => {
            pendingUsername = '';
            addPromptLine(getPrompt());
          });
        return;
      }

      if (mode === 'adduser-username') {
        pendingNewUsername = value;
        mode = 'adduser-password';
        addPromptLine(PROMPT_NEW_PASSWORD, true);
        return;
      }

      if (mode === 'adduser-password') {
        mode = 'command';
        fetch('/users', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: pendingNewUsername, password: value }),
        })
          .then((res) => {
            if (res.ok) {
              printLine('user "' + pendingNewUsername + '" created.');
              return;
            }
            return res
              .json()
              .then((data) => printLine('adduser: ' + (data.message || 'failed to create user.')))
              .catch(() => printLine('adduser: failed to create user.'));
          })
          .catch(() => printLine('connection error: could not reach the server.'))
          .finally(() => {
            pendingNewUsername = '';
            addPromptLine(getPrompt());
          });
        return;
      }

      const [command, ...args] = value.trim().split(/\s+/).filter(Boolean);

      switch (command) {
        case 'clear':
          termBody.innerHTML = '';
          addPromptLine(getPrompt());
          break;
        case 'help':
          printLine('clear            clear the terminal screen');
          printLine('help             show available commands');
          printLine('auth             authenticate with a username and password');
          printLine('                 (run with no arguments; password is entered');
          printLine('                 at a separate hidden prompt, never inline)');
          printLine('logout           end the current session');
          extraCommands.forEach((entry) => {
            printLine(entry.name.padEnd(17, ' ') + '(granted command)');
          });
          addPromptLine(getPrompt());
          break;
        case 'auth':
          if (args.length > 0) {
            printLine('auth: credentials must not be passed inline.');
            printLine('Run "auth" with no arguments and follow the prompts.');
            addPromptLine(getPrompt());
          } else {
            mode = 'auth-user';
            addPromptLine(PROMPT_USER);
          }
          break;
        case 'logout':
          if (!currentUser) {
            printLine('not logged in.');
            addPromptLine(getPrompt());
          } else {
            fetch('/auth/logout', { method: 'POST', credentials: 'include' })
              .then(() => {
                currentUser = null;
                extraCommands = [];
                printLine('logged out.');
              })
              .catch(() => printLine('connection error: could not reach auth service.'))
              .finally(() => addPromptLine(getPrompt()));
          }
          break;
        case 'adduser':
          if (!extraCommands.some((entry) => entry.name === 'adduser')) {
            // Not granted — behaves like any other unknown command.
            addPromptLine(getPrompt());
          } else if (args.length > 0) {
            printLine('adduser: credentials must not be passed inline.');
            printLine('Run "adduser" with no arguments and follow the prompts.');
            addPromptLine(getPrompt());
          } else {
            mode = 'adduser-username';
            addPromptLine(PROMPT_NEW_USERNAME);
          }
          break;
        case 'whoami':
          if (!extraCommands.some((entry) => entry.name === 'whoami')) {
            // Not granted — behaves like any other unknown command.
            addPromptLine(getPrompt());
          } else {
            // Dynamic — reflects the actual current request, so it always
            // hits the server instead of printing a cached static string.
            fetch('/whoami', { credentials: 'include' })
              .then((res) => {
                if (!res.ok) {
                  printLine('whoami: permission denied.');
                  return;
                }
                return res.json().then((info) => {
                  printLine('ip:         ' + info.ip);
                  printLine('location:   ' + info.location);
                  printLine('browser:    ' + info.browser);
                  printLine('engine:     ' + info.engine);
                  printLine('os:         ' + info.os);
                  printLine('device:     ' + info.device);
                  printLine('language:   ' + info.language);
                  printLine('referer:    ' + info.referer);
                  printLine('user-agent: ' + info.userAgent);
                });
              })
              .catch(() => printLine('connection error: could not reach the server.'))
              .finally(() => addPromptLine(getPrompt()));
          }
          break;
        case 'get-visits':
          if (!extraCommands.some((entry) => entry.name === 'get-visits')) {
            // Not granted — behaves like any other unknown command.
            addPromptLine(getPrompt());
          } else if (args.length > 0) {
            // get-visits <id> — full detail for one visit.
            fetch('/visits/' + encodeURIComponent(args[0]), { credentials: 'include' })
              .then((res) => {
                if (res.status === 404) {
                  printLine('get-visits: no visit with that id.');
                  return;
                }
                if (!res.ok) {
                  printLine('get-visits: permission denied.');
                  return;
                }
                return res.json().then((v) => {
                  printLine('id:          ' + v.id);
                  printLine('visitorId:   ' + v.visitorId);
                  printLine('userId:      ' + (v.userId || '—'));
                  printLine('ip:          ' + v.ip);
                  printLine('location:    ' + v.location);
                  printLine('browser:     ' + v.browser);
                  printLine('engine:      ' + v.engine);
                  printLine('os:          ' + v.os);
                  printLine('device:      ' + v.device);
                  printLine('language:    ' + v.language);
                  printLine('referer:     ' + v.referer);
                  printLine('user-agent:  ' + v.userAgent);
                  printLine('lastPath:    ' + v.lastPath);
                  printLine('visitCount:  ' + v.visitCount);
                  printLine('metadata:    ' + (v.metadata ? JSON.stringify(v.metadata) : '—'));
                  printLine('createdAt:   ' + v.createdAt);
                  printLine('updatedAt:   ' + v.updatedAt);
                });
              })
              .catch(() => printLine('connection error: could not reach the server.'))
              .finally(() => addPromptLine(getPrompt()));
          } else {
            // Default page only (first 20, most recent first) — full
            // limit/offset/desc/date filtering is available by calling
            // GET /visits directly. Run "get-visits <id>" for full detail.
            fetch('/visits', { credentials: 'include' })
              .then((res) => {
                if (!res.ok) {
                  printLine('get-visits: permission denied.');
                  return;
                }
                return res.json().then((data) => {
                  if (data.items.length === 0) {
                    printLine('no visits recorded.');
                  } else {
                    data.items.forEach((v) => {
                      const seen = new Date(v.updatedAt).toISOString().slice(0, 16).replace('T', ' ');
                      printLine(
                        v.id + '  ' + seen + '  ' + v.ip.padEnd(16, ' ') + v.lastPath.padEnd(14, ' ') + 'visits:' + v.visitCount,
                      );
                    });
                  }
                  printLine('showing ' + data.items.length + ' of ' + data.total + ' total visits.');
                });
              })
              .catch(() => printLine('connection error: could not reach the server.'))
              .finally(() => addPromptLine(getPrompt()));
          }
          break;
        default: {
          const granted = extraCommands.find((entry) => entry.name === command);
          if (granted) {
            printLine(granted.response);
          }
          addPromptLine(getPrompt());
        }
      }
    }

    hiddenInput.addEventListener('input', updateCurrentLine);
    hiddenInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleEnter();
      }
    });

    document.addEventListener('click', focusInput);
    window.addEventListener('load', focusInput);

    if (currentUser) {
      printLine('session restored: logged in as ' + currentUser + '.');
    }
    addPromptLine(getPrompt());
  </script>
</body>
</html>
